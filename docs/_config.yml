# GitHub Pages (just-the-docs) configuration for the mono-agent documentation site.
# Served from /docs on main via "Deploy from a branch". GitHub's native Jekyll
# build runs jekyll-remote-theme — no Actions workflow and no build step required.
title: mono-agent
description: >-
  Config-first agent framework — one mono-agent.config.json turns any folder into
  a running agent over webhook, OpenAI-compatible API, Telegram, Slack, WhatsApp,
  A2A, and cron, with tiered memory, sandboxing, and observability.

remote_theme: just-the-docs/just-the-docs

# Published at https://robertsreberski.github.io/mono-agent/
url: https://robertsreberski.github.io
baseurl: /mono-agent

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Built-in client-side search.
search_enabled: true
search:
  heading_level: 2
  previews: 2
  rel_url: true
  button: true

# Internal planning/aux docs — kept in the repo for github.com readers but left
# out of the published site so the nav stays clean.
exclude:
  - superpowers/
  - skills/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/

color_scheme: dark

aux_links:
  GitHub repo:
    - https://github.com/robertsreberski/mono-agent
  npm (@mono-agent):
    - https://www.npmjs.com/org/mono-agent
aux_links_new_tab: true

# "Edit this page on GitHub" link in the footer of every page.
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/robertsreberski/mono-agent
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

# Coloured callout boxes ({: .note }, {: .warning }, {: .tip }).
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red

footer_content: >-
  mono-agent — config-first agent framework. Published from
  <code>/docs</code> on <code>main</code>.
