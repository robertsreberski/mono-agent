packages:
  - "packages/*"
  - "extras/*"

allowBuilds:
  '@google/genai': true
  '@whiskeysockets/baileys': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.80.5'
  - '@earendil-works/pi-ai@0.80.5'

onlyBuiltDependencies:
  - better-sqlite3
  - sqlite-vec
