packages:
  - "packages/*"
  - "extras/*"

allowBuilds:
  '@google/genai': true
  '@whiskeysockets/baileys': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true

# No package release-age cooldown is currently enforced. Keep exclusions absent
# unless a nonzero minimumReleaseAge is committed here with their rationale.

onlyBuiltDependencies:
  - better-sqlite3
  - sqlite-vec
