packages:
  - "packages/*"
  - "extras/*"

allowBuilds:
  '@google/genai': true
  '@whiskeysockets/baileys': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true

# pnpm 11 cannot switch package-manager versions: it fails closed under corepack, and its
# download path rejects any resolution without lockfile integrity. Left at the default, a
# contributor whose pnpm differs from the packageManager pin would have every command in this
# repo hard-fail. Warn instead — CI proves the exact version by installing it explicitly, and
# scripts/__tests__/pnpm-release-age-policy.test.mjs holds the pin and the workflows together.
pmOnFail: warn

# Package release-age cooldown is explicitly disabled across supported pnpm versions.
# Keep minimumReleaseAgeExclude absent while minimumReleaseAge remains 0.
minimumReleaseAge: 0

# Security floors for production transitive ranges. Keep these exact so the
# advisory gate and every packed consumer resolve the reviewed fixed versions.
overrides:
  fast-uri: 3.1.5
  ip-address: 10.3.1
  protobufjs: 7.6.5
  sharp: 0.35.3
  ws: 8.21.1

onlyBuiltDependencies:
  - better-sqlite3
  - sqlite-vec
