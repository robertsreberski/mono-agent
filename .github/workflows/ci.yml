name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    # scripts/__tests__/verify-all.test.mjs enforces ordered argv and Node-condition
    # parity with scripts/verify-all.mjs; VERIFY_GATE_DELTA declares every exception.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node-version }}"

      - name: Enable Corepack
        run: corepack enable

      - name: Check pnpm release-age policy
        run: node scripts/pnpm-release-age-policy.mjs

      - name: Check Node support floor
        run: pnpm run check:node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production dependency vulnerabilities
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run check:dependency-vulnerabilities

      - name: Check secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact --no-banner --config /repo/.gitleaks.toml /repo

      - name: Check OSS hygiene
        run: pnpm run check:oss-hygiene

      - name: Check license consistency
        run: pnpm run check:licenses

      - name: Check Codex discoverability
        run: pnpm run check:codex-discoverability

      - name: Derive release smoke tag
        id: release-smoke
        run: |
          set -euo pipefail
          VERSION="$(node -e "process.stdout.write(require('./packages/agent-app/package.json').version)")"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release package graph
        run: pnpm run release:validate -- --tag "${{ steps.release-smoke.outputs.tag }}"

      - name: Check package architecture
        run: pnpm run check:architecture

      - name: Build packages and demos
        run: pnpm run build

      - name: Verify consumer contracts
        run: pnpm run verify:consumers --skip-build

      - name: Validate package tarballs
        run: pnpm run release:pack -- --tag "${{ steps.release-smoke.outputs.tag }}"

      - name: Install packed consumer at the minimum Node version
        if: ${{ matrix.node-version == '22.19.0' }}
        run: pnpm run release:consumer -- --tag "${{ steps.release-smoke.outputs.tag }}" --require-minimum

      - name: Typecheck packages and demos
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Check whitespace
        run: git diff --check

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # website/ is an isolated pnpm workspace (own lockfile) that renders ../docs.
    # Gate its full pipeline — sync-content -> astro build -> check-links — so the
    # docs site cannot rot silently. Runs in parallel with `verify`; keep it out
    # of that job so verify's wall time stays flat.
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site (sync-content -> astro build -> check-links)
        run: pnpm run build
