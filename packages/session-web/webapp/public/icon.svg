<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Session Recorder">
  <defs>
    <radialGradient id="bg" cx="72%" cy="18%" r="90%">
      <stop offset="0" stop-color="#17181d"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </radialGradient>
    <radialGradient id="rec" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ff8a7d"/>
      <stop offset="1" stop-color="#E0685B"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- concentric recorder rings -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(232,162,74,0.22)" stroke-width="3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(79,182,166,0.28)" stroke-width="3"/>
  <circle cx="256" cy="256" r="92" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <!-- ticks -->
  <g stroke="rgba(255,255,255,0.16)" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="70" x2="256" y2="90"/>
    <line x1="256" y1="422" x2="256" y2="442"/>
    <line x1="70" y1="256" x2="90" y2="256"/>
    <line x1="422" y1="256" x2="442" y2="256"/>
  </g>
  <!-- rec dot -->
  <circle cx="256" cy="256" r="52" fill="url(#rec)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="52" fill="url(#rec)"/>
</svg>
