# Makes webapp/ a self-contained pnpm project (its own lockfile), independent of
# the monorepo root workspace — so `pnpm install` here installs only the PWA's
# deps and never sweeps the Vite build into the repo's `pnpm -r run build`/`test`.
# Mirrors how website/ is isolated.
packages: []

allowBuilds:
  esbuild: true

# Pre-approve native/postinstall build scripts so install is non-interactive.
onlyBuiltDependencies:
  - esbuild
