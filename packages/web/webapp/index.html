<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eeefeb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1110" />
    <meta name="description" content="Always-on local console for your mono-agent fleet." />
    <!--
      Home-screen install: no browser chrome.

      Deliberately NO `apple-mobile-web-app-title`. This document is served as a
      static file to every host, and that meta OVERRIDES the manifest's
      `short_name` on iOS -- which the service templates per host
      (`short_name: identity.hostName`), so two installed consoles are
      distinguishable on the same home screen. A constant here would name them
      both "mono-agent". iOS 16.4+ takes the name from the manifest.

      The status bar stays `default` rather than `black-translucent` on purpose.
      `black-translucent` draws WHITE status-bar glyphs whatever is behind them,
      and this console's light theme paints `#eeefeb` up there -- an invisible
      clock and battery. `default` lets iOS take the status bar's appearance from
      the `theme-color` pair above, so it is legible in both themes. The layout
      is already ready for the other choice: `viewport-fit=cover` is set and every
      top edge pads by `env(safe-area-inset-top)`.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>mono-agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
