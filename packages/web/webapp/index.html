<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141715" />
    <meta name="description" content="Always-on local console for your mono-agent fleet." />
    <!--
      Home-screen install: no browser chrome.

      Deliberately NO `apple-mobile-web-app-title`. This document is served as a
      static file to every host, and that meta OVERRIDES the manifest's
      `short_name` on iOS -- which the service templates per host
      (`short_name: identity.displayName`), so two installed consoles are
      distinguishable on the same home screen. A constant here would name them
      both "mono-agent". iOS 16.4+ takes the name from the manifest.

      Use the opaque system status bar (`default`): iOS/iPadOS 27's hard
      scroll-edge blur cannot be suppressed under `black-translucent`. With
      `default` the web view starts below the system bar instead of extending
      behind it. A real fixed, full-width, opaque `.status-bar-surface` at the
      document's top edge drives WebKit's colour extension into the system bar
      and suppresses the scroll-edge effect without extra header clearance.
      WebKit's `LocalFrameView::fixedContainerEdges` probes the top midpoint at
      y=4; the standalone strip is at least 6px tall even with a zero safe inset.
      Headers retain `env(safe-area-inset-top)` for tabs and older installs that
      still lay out beneath system UI, with a padding floor above the strip.

      iOS reads this meta at INSTALL time (WebKit 316008): existing installs must
      be removed from the Home Screen and added again to adopt the new mode.
      Under `default`, WebKit may sample and cache the system band's colour
      until relaunch (WebKit 301994); CSS can update the document's edge but
      cannot guarantee a live system-bar recolour. Glyph contrast follows the
      system appearance, as do the console's light/dark themes.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>mono-agent</title>
  </head>
  <body>
    <!-- Fixed top-edge container for WebKit's status colour extension; survives React loading/errors. -->
    <div class="status-bar-surface" aria-hidden="true" inert></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
