# Keep the console frontend isolated from the monorepo package graph. The
# publishable @mono-agent/web package builds this app explicitly.
packages: []

# Package release-age cooldown is explicitly disabled across supported pnpm versions.
# Keep minimumReleaseAgeExclude absent while minimumReleaseAge remains 0.
minimumReleaseAge: 0

# Security floors for production transitive ranges. Keep these exact so the
# isolated webapp resolves the reviewed fixed versions.
overrides:
  fast-uri: 3.1.7

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
