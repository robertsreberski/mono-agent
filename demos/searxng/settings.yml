use_default_settings:
  engines:
    keep_only:
      - yahoo

general:
  debug: false
  instance_name: "mono-agent local search"

search:
  safe_search: 0
  formats:
    - html
    - json

server:
  # The container environment supplies the real value.
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "POST"

outgoing:
  # Yahoo currently disconnects SearXNG's HTTP/2 transport on otherwise valid
  # searches. Pin this local companion to HTTP/1.1 so the sole enabled engine
  # remains usable instead of reporting `HTTP protocol error` on every query.
  enable_http2: false

# Keep only the measured working Yahoo definition from the pinned image. A plain
# `use_default_settings: true` silently retained unrelated default engines, so a
# query could mix a good Yahoo result with low-relevance or blocked sources.
engines:
  - name: yahoo
    disabled: false
