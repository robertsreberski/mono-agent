use_default_settings: true

general:
  debug: false
  instance_name: "mono-agent local search"

search:
  safe_search: 0
  formats:
    - html
    - json

server:
  # The container environment supplies the real value.
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "POST"

# The stock general engine set is unusable from an ordinary residential IP: every
# one of duckduckgo, startpage and qwant answers with a CAPTCHA, and google cse
# needs an API key this instance does not carry. That left `general` searches
# returning HTTP 200 with an empty result list on every query. Entries here merge
# into the defaults by name (use_default_settings is on), so this block only flips
# the `disabled` flag — engine definitions still come from the image.
engines:
  # Enabled: measured working from a residential IP. bing is the workhorse;
  # mwmbl and marginalia are small independent indexes kept for redundancy,
  # because a single engine suspends under the tool's own query fan-out.
  - name: bing
    disabled: false
  - name: mwmbl
    disabled: false
  - name: marginalia
    disabled: false
  # Disabled: these only ever contribute a failure, and a failing engine still
  # costs the request its timeout before it is suspended.
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: google cse
    disabled: true
